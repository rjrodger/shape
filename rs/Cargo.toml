[package]
name = "shape"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Schema by example: validate and complete values against a spec written as an example of the value. The Rust port of shape."
license = "MIT"
repository = "https://github.com/rjrodger/shape"
readme = "README.md"
keywords = ["validation", "schema", "json", "shape"]
categories = ["data-structures", "parsing"]

[lib]
path = "src/lib.rs"

[dependencies]
indexmap = "2"
regex = "1"
num-bigint = "0.4"
serde = { version = "1", optional = true }
# preserve_order keeps object keys in insertion order, as a JavaScript object
# does; float_roundtrip parses a long integer to the nearest double, as
# JavaScript does (without it 123456789012345680000 reads one ulp low).
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"], optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_json"]
