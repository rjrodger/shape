# Prose gate. Runs over docs/ and the four READMEs in CI; see
# .github/workflows/docs.yml and docs/STYLE-GUIDE.md.
#
# Precedence, decided deliberately and recorded in the style guide:
#
#   house voice  ->  Google  ->  Vale defaults
#
# Google (developers.google.com/style) is the base for everything the
# house guide is silent on. Where the two collide the house voice wins,
# and every such override is listed below with its reason, so a reader
# who wonders why a Google rule is off finds the answer here rather than
# guessing it is an oversight.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Shape
# PINNED BY URL, not by name. `Packages = Google` resolves to whatever
# the package registry serves at sync time, so a Google release could
# add or change an error-level rule and turn an unrelated docs pull
# request red -- exactly the nondeterminism pinning the BINARY was
# supposed to prevent. Pinning one without the other prevented half of
# it.
#
# v0.7.1 is the release every count in this file was measured against.
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip

[*.md]
BasedOnStyles = Vale, Google, Shape

# The READMEs are in scope too: the style guide is normative for them,
# and they are the first prose most readers see (npm renders ts/,
# pkg.go.dev renders go/, crates.io renders rs/, GitHub renders the
# root). The plans under docs/design/ are working documents for
# maintainers, not documentation, and the note at the bottom of this
# file says how they are kept out. They sit under docs/ so that one
# directory holds everything written about this project, which is why
# the exclusion is a glob rather than a shorter argument list.

# Documentation must not CITE those working documents either. A link out
# of a docs page into a plan or a decision record strands the reader in
# material written for somebody else and revised on somebody else's
# schedule. That rule is docs.test.ts `no-internal-doc-references`, not a
# Vale rule, because the file sets differ: Vale lints docs/adr/, where
# citing the analysis a decision came from is exactly right.

# --- Overrides where the house voice wins ------------------------------
#
# The register is Richard Rodger's blog voice, not neutral vendor docs.
# These four rules encode Google's house style, not correctness, and
# each one would flatten a voice choice the guide makes on purpose.

# "We" is allowed in TUTORIALS ONLY, where the page walks through code
# with the reader (STYLE-GUIDE.md, voice rule 7). Vale cannot express
# "only in tutorials", so the rule is off here and the restriction is
# carried by docs.test.ts `we-appears-only-in-tutorials`, which knows
# which page is which.
Google.We = NO

# "I" appears nowhere in the docs by house rule, which is STRICTER than
# Google's. docs.test.ts `first-person-singular-appears-nowhere` covers
# it, including `my` and `mine`; this rule also fires on "me" inside
# quoted CLI output, so it is off here.
#
# Switching a Google rule off in favour of a house rule means the house
# rule has to be real: the named test is the receipt. Its first run
# found four violations in the root README that both gates had been
# blind to.
Google.FirstPerson = NO

# The house voice alternates long explanatory sentences with short
# verdicts, and the occasional passive is how a sentence keeps its
# subject on the thing being documented ("the value is produced in
# place"). 265 hits, almost all of them fine. Advisory only, never a
# gate.
Google.Passive = suggestion

# Contractions are a register choice per document kind, not a rule:
# tutorials contract, reference pages do not. 157 hits, none of them
# defects. Advisory only.
Google.Contractions = suggestion

# --- The gate ----------------------------------------------------------
#
# Everything below is error-level and fails CI. These are the Google
# rules that carry no voice cost: they are conventions a reader benefits
# from and an author has no reason to vary.
Google.EmDash = error
Google.OxfordComma = error
Google.Anthropomorphism = error
Google.ExcessiveClaims = error
Google.Spelling = error
Google.Latin = error
Google.Exclamation = error

# Flags an `-ly` adverb before a hyphen ("wrongly-typed"), which is a
# real error class -- but it cannot tell an adverb from a word that
# merely ends in those two letters, so `supply-chain` and `early-` trip
# it. Measured before promoting, per the standard below: 1 hit across
# docs/ and the four READMEs, and it was a real one (`wrongly-typed` in
# the builder reference). Zero false positives, so it gates here.
Google.LyHyphens = error

# --- Demoted on evidence, not on taste --------------------------------
#
# Each of these was tried at error level against the real pages first.
# They are warnings because they were WRONG here, not because they were
# inconvenient; the count is what each produced on a clean run.

# Maps `touch` to `tap` (a mobile-UI rule) and `application` to `app`.
# 18 hits, of which the 16 that hold are the substitutions carried at
# error level by Shape.WordChoice; the remaining two are the mobile-UI
# mapping and a use of "application" that is the right word.
Google.WordListCase = warning

# Wants DSL, ASCII, ISO, RFC and OIDC spelled out. The audience is people
# writing validators; padding the prose with "American Standard Code for
# Information Interchange" would serve nobody, and `DSL` alone is 28 of
# the 64 hits, in a project whose reference page is named for it.
Google.Acronyms = warning

# Flags "TypeScript <-> Go <-> Rust parity" and "The Rust port" as not
# sentence case. Both ARE sentence case; the rule cannot know that
# TypeScript, Go and Rust are proper nouns. 20 hits, all false, and this
# project names three languages on nearly every page.
Google.Headings = warning

# US convention: commas and periods INSIDE the quotation marks. The
# house voice is not US English -- the same call as the -ise spellings
# in accept.txt -- and putting a period inside a quoted `code span` is
# actively wrong when the quote is a literal. 11 hits.
Google.Quotes = warning

# "Use parentheses judiciously" is advice, not a rule, and the house
# guide already rations them more precisely than this can (voice rule 4:
# definitions, caveats, and at most one dry aside per page). 254 hits.
Google.Parens = warning

# 140 hits. A semicolon joining two clauses of one thought is how the
# long half of the long-then-short rhythm is built; the guide rations
# the aside, not the punctuation that carries it.
Google.Semicolons = warning

# 9 hits, all of them a future tense that is about the reader's next
# step rather than a hedge ("the walk will visit every key").
Google.Will = warning

# --- Working documents, not documentation -----------------------------
#
# docs/design/ holds the plans. They are maintainers' working material:
# argued rather than stated, revised as the code moves, and deliberately
# not on the website (site/build.js skips the directory). Linting them to
# the standard of a reference page would enforce the wrong thing.
#
# They are excluded by the GLOB the gate is invoked with, not by a
# section here. A section cannot do it: Vale merges `[docs/design/*.md]`
# onto `[*.md]` rather than replacing it, so an empty BasedOnStyles
# leaves every rule running -- measured, and the reason this is a
# comment rather than four lines of ini. The one invocation lives in
# `make lint-docs`, which the workflow calls, so a local run and CI
# cannot disagree about what is linted.
