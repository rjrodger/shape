name: Pages

# Builds the project site (site/build.js: the documentation and the
# performance report) and deploys it to GitHub Pages. Runs on every push to
# main that touches a page or a measurement, on demand, and when the
# Measure workflow records new runs.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'bench/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'go/README.md'
      - 'ts/README.md'
      - 'rs/README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the report reads bench/cases.json at each
          # run's commit to tell which cases are still comparable.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - run: cd site && npm install --no-audit --no-fund && node build.js

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
