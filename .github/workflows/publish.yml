name: Publish

# Publishes the npm package, tags the Go module and publishes the Rust
# crate. Run by hand from the Actions tab (or `gh workflow run publish.yml`).
#
# npm and crates.io need no token: the job publishes with OpenID Connect
# trusted publishing, so npmjs.com must list this repository and workflow as
# a trusted publisher of the `shape` package, and crates.io the same for the
# `shape-schema` crate. The Go module is published by pushing its tag;
# proxy.golang.org picks it up from there.
#
# Each input is a version bump (`patch`, `minor`, `major`), an explicit
# `x.y.z`, `current` to publish the version already in the tree, or `skip`.
#
# Only main is released. A run that failed after `npm publish` can simply be
# re-run with the same inputs: a version already on the registry is not
# published again, and the tag, the push and the GitHub release are each
# done only if missing.

on:
  workflow_dispatch:
    inputs:
      npm:
        description: 'npm (ts/package.json): patch | minor | major | x.y.z | current | skip'
        required: true
        default: current
      go:
        description: 'Go (const Version in go/shape.go): patch | minor | major | x.y.z | current | skip'
        required: true
        default: current
      rust:
        description: 'Rust (version in rs/Cargo.toml): patch | minor | major | x.y.z | current | skip'
        required: true
        default: current

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NPM_INPUT: ${{ inputs.npm }}
      GO_INPUT: ${{ inputs.go }}
      RUST_INPUT: ${{ inputs.rust }}

    steps:
      - name: Only main is released
        if: github.ref != 'refs/heads/main'
        run: |
          echo "publish runs on main only, not ${{ github.ref }}" >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-go@v5
        with:
          go-version: 1.22.x
          cache: false

      - uses: dtolnay/rust-toolchain@stable

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest && npm --version

      - name: Build and test every language
        run: |
          cd ts && npm install && cd ..
          make build test

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish npm
        if: inputs.npm != 'skip'
        working-directory: ts
        run: |
          set -euo pipefail
          case "$NPM_INPUT" in
            current) ;;
            patch|minor|major) npm version "$NPM_INPUT" --no-git-tag-version >/dev/null ;;
            *) npm version "$NPM_INPUT" --no-git-tag-version --allow-same-version >/dev/null ;;
          esac
          # Rebuild, so dist carries the bumped VERSION constant.
          npm run build
          V=$(node -p "require('./package.json').version")
          echo "Publishing ts/v$V"
          git add package.json src/shape.ts
          git diff --cached --quiet || git commit -m "ts: v$V"
          git rev-parse -q --verify "refs/tags/ts/v$V" >/dev/null || git tag "ts/v$V"
          # A version already on the registry is a run that failed after
          # publishing: finish its push and release rather than publish again.
          if npm view "shape@$V" version >/dev/null 2>&1; then
            echo "shape@$V is already on the registry; completing the release"
          else
            npm publish --access public
          fi
          git push origin HEAD:main "ts/v$V"
          gh release view "ts/v$V" >/dev/null 2>&1 ||
            gh release create "ts/v$V" --title "ts/v$V" --notes "npm package release v$V"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish Go
        if: inputs.go != 'skip'
        run: |
          set -euo pipefail
          CUR=$(sed -n 's/^const Version = "\(.*\)"/\1/p' go/shape.go)
          case "$GO_INPUT" in
            current) V="$CUR" ;;
            patch|minor|major)
              V=$(node -e "
                const v = '$CUR'.split('.').map(Number)
                const i = { major: 0, minor: 1, patch: 2 }['$GO_INPUT']
                v[i]++; for (let j = i + 1; j < 3; j++) v[j] = 0
                console.log(v.join('.'))") ;;
            *) V="$GO_INPUT" ;;
          esac
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "go: '$V' is not an x.y.z version" >&2; exit 1
          fi
          # A tag that already exists may only be finished, not moved: the
          # tree must already carry that version.
          if git rev-parse -q --verify "refs/tags/go/v$V" >/dev/null && [ "$CUR" != "$V" ]; then
            echo "go/v$V is already tagged, but go/shape.go says $CUR" >&2; exit 1
          fi
          echo "Publishing go/v$V"
          sed -i "s/^const Version = \".*\"/const Version = \"$V\"/" go/shape.go
          git add go/shape.go
          git diff --cached --quiet || git commit -m "go: v$V"
          git rev-parse -q --verify "refs/tags/go/v$V" >/dev/null || git tag "go/v$V"
          git push origin HEAD:main "go/v$V"
          gh release view "go/v$V" >/dev/null 2>&1 ||
            gh release create "go/v$V" --title "go/v$V" --notes "Go module release v$V"
          # Ask the proxy for the new version so it is cached at once.
          GOPROXY=https://proxy.golang.org GOFLAGS=-mod=mod go list -m "github.com/rjrodger/shape/go@v$V" || true
        env:
          GH_TOKEN: ${{ github.token }}

      # crates.io trusted publishing: the action exchanges the job's OIDC
      # token for a short-lived registry token, so crates.io must list this
      # repository and workflow for the crate. A trusted publisher is
      # configured on a crate that exists, so the first release of a new one
      # cannot use it: the step is allowed to fail and the publish falls back
      # to the CARGO_REGISTRY_TOKEN secret.
      - uses: rust-lang/crates-io-auth-action@v1
        if: inputs.rust != 'skip'
        id: crates-auth
        continue-on-error: true

      - name: Publish Rust
        if: inputs.rust != 'skip'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CUR=$(sed -n '0,/^version = "\(.*\)"/s//\1/p' rs/Cargo.toml)
          CRATE=$(sed -n '0,/^name = "\(.*\)"/s//\1/p' rs/Cargo.toml)
          case "$RUST_INPUT" in
            current) V="$CUR" ;;
            patch|minor|major)
              V=$(node -e "
                const v = '$CUR'.split('.').map(Number)
                const i = { major: 0, minor: 1, patch: 2 }['$RUST_INPUT']
                v[i]++; for (let j = i + 1; j < 3; j++) v[j] = 0
                console.log(v.join('.'))") ;;
            *) V="$RUST_INPUT" ;;
          esac
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "rust: '$V' is not an x.y.z version" >&2; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/rs/v$V" >/dev/null && [ "$CUR" != "$V" ]; then
            echo "rs/v$V is already tagged, but rs/Cargo.toml says $CUR" >&2; exit 1
          fi
          echo "Publishing rs/v$V ($CRATE)"
          sed -i "0,/^version = \".*\"/s//version = \"$V\"/" rs/Cargo.toml
          (cd rs && cargo update -p "$CRATE" --offline >/dev/null 2>&1 || true)
          git add rs/Cargo.toml rs/Cargo.lock
          git diff --cached --quiet || git commit -m "rs: v$V"
          git rev-parse -q --verify "refs/tags/rs/v$V" >/dev/null || git tag "rs/v$V"
          # A version already on the registry is a run that failed after
          # publishing: finish its push and release rather than publish again.
          if cargo search "$CRATE" --limit 1 | grep -q "^$CRATE = \"$V\""; then
            echo "$CRATE $V is already on crates.io; completing the release"
          else
            # Only an upload needs a credential: a re-run that finds the
            # version already published still has its tag and release to do.
            if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
              echo "rust: no registry credential: crates.io lists no trusted publisher for this workflow, and the CARGO_REGISTRY_TOKEN secret is unset" >&2
              exit 1
            fi
            (cd rs && cargo publish --all-features)
          fi
          git push origin HEAD:main "rs/v$V"
          gh release view "rs/v$V" >/dev/null 2>&1 ||
            gh release create "rs/v$V" --title "rs/v$V" --notes "Rust crate release v$V ($CRATE)"
