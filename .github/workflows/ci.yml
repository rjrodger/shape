name: CI

on: ['push']

jobs:
  build-and-test:
    timeout-minutes: 6

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x, 24.x]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: ts

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm install
      - run: npm run build
      - run: npm test

  go-build-and-test:
    timeout-minutes: 6

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ['1.22.x']

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: go

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  rust-build-and-test:
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: rs

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo build --all-features
      - run: cargo test --all-features

  # Line coverage of the Rust crate, held to 100% as the other two are.
  rust-coverage:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rs

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov

      - run: ./cover.sh

  # The differential parity harness: thousands of generated cases through all
  # three implementations, comparing the JSON Schema export, verdict, produced
  # value and exact error text. Needs every toolchain in one job.
  parity:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false

      - uses: dtolnay/rust-toolchain@stable

      - run: cd ts && npm install
      - run: make diff

  # The benchmarks, briefly and without recording anything, so they cannot
  # rot: every library must still agree on every case's verdict.
  bench-smoke:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - uses: actions/setup-go@v5
        with:
          go-version-file: bench/go/go.mod
          cache: false

      - uses: dtolnay/rust-toolchain@stable

      - run: cd ts && npm install
      - run: make bench-smoke
